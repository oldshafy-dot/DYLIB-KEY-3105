name: iOS Dylib Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build ROBO iOS 3105 Dylib
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build dynamic library
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build artifacts
          mkdir -p artifacts

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"

          xcrun swiftc \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios16.0 \
            -emit-library \
            -module-name RoboIOS3105Dylib \
            -O \
            -o "artifacts/RoboIOS3105Dylib.dylib" \
            RoboIOS3105/DylibEntry.swift

          test -f "artifacts/RoboIOS3105Dylib.dylib"
          file "artifacts/RoboIOS3105Dylib.dylib"
          ls -lh artifacts/RoboIOS3105Dylib.dylib

      - name: Build Xcode dylib target
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project RoboIOS3105.xcodeproj \
            -scheme RoboIOS3105Dylib \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee xcodebuild.log

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: ROBO-iOS-3105-dylib
          path: |
            artifacts/RoboIOS3105Dylib.dylib
            xcodebuild.log
          if-no-files-found: error
