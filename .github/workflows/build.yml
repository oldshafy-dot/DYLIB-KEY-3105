name: iOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build ROBO iOS 3105
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project RoboIOS3105.xcodeproj \
            -scheme RoboIOS3105Dylib \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee xcodebuild.log

      - name: Find built app
        run: |
          find build -type f -name "*.dylib" -print

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROBO-iOS-3105-dylib
          path: build/Build/Products/Release-iphoneos/*.dylib
          if-no-files-found: error
